<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tm-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="tm-border-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="tm-text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#00d9ff" />
    </linearGradient>
    <filter id="tm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#00d9ff" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle with glow border -->
  <rect x="8" y="8" width="164" height="164" rx="44" fill="url(#tm-bg-dark)" />
  <rect x="8" y="8" width="164" height="164" rx="44" stroke="url(#tm-border-dark)" stroke-width="4" />

  <!-- Monogram TM in beautiful italic serif typography -->
  <text 
    x="90" 
    y="118" 
    text-anchor="middle" 
    font-family="Playfair Display, Georgia, 'Times New Roman', serif" 
    font-style="italic" 
    font-weight="700" 
    font-size="94" 
    letter-spacing="-3"
    fill="url(#tm-text-grad)"
    filter="url(#tm-glow)"
  >TM</text>
</svg>